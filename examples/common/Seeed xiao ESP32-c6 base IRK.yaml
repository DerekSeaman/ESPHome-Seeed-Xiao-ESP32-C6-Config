# Seeed XIAO ESP32-C6 hardware add-on: status LED, external antenna control (FM8625H RF switch),
# and Wi-Fi diagnostics beyond what the irk-capture package exposes.
# Everything else (Wi-Fi, API, OTA, BLE/IRK capture) comes from the ESPHome Device Builder-generated
# device YAML and the irk-capture package.

esp32:
    # Explicit board ID (not just variant) so board-specific pin aliases
    # like RF_SWITCH_EN / RF_ANT_SELECT resolve correctly.
    board: seeed_xiao_esp32c6
    framework:
        sdkconfig_options:
            # Wi-Fi 6 (802.11ax) support on the C6 radio
            CONFIG_SOC_WIFI_HE_SUPPORT: y
            CONFIG_ESP_WIFI_11AX_SUPPORT: y

esphome:
    on_boot:
        priority: -10
        then:
            # Enable external antenna by default (FM8625H RF switch)
            - output.turn_off: rf_switch_enable    # LOW -> RF switch power ON
            - output.turn_on: rf_antenna_select    # HIGH -> external antenna (U.FL)

logger:
    hardware_uart: USB_SERIAL_JTAG

wifi:
    on_disconnect:
        then:
            - lambda: |-
                id(_wifi_disconnects_since_boot)++;

# Status LED on Seeed XIAO ESP32-C6 (GPIO15, not inverted to match your working config)
status_led:
    pin:
        number: GPIO15

# External antenna control using ESPHome 2025.12+ board aliases (FM8625H RF switch)
# RF_SWITCH_EN (GPIO3) = RF switch power, RF_ANT_SELECT (GPIO14) = antenna selector
output:
    - platform: gpio
      id: rf_switch_enable
      pin: RF_SWITCH_EN

    - platform: gpio
      id: rf_antenna_select
      pin: RF_ANT_SELECT

# External antenna selector (FM8625H RF switch control)
switch:
    - platform: template
      name: "External Antenna"
      optimistic: true
      restore_mode: ALWAYS_ON
      turn_on_action:
          - output.turn_off: rf_switch_enable    # LOW -> RF switch power ON
          - output.turn_on: rf_antenna_select    # HIGH -> external antenna (U.FL/RF2)
      turn_off_action:
          - output.turn_off: rf_switch_enable    # LOW -> RF switch power ON
          - output.turn_off: rf_antenna_select   # LOW -> internal antenna (PCB/RF1)

# Extra Wi-Fi diagnostics not covered by the irk-capture package
text_sensor:
    - platform: wifi_info
      mac_address:
          name: "MAC"
          entity_category: diagnostic
      ssid:
          name: "SSID"
          entity_category: diagnostic

sensor:
    - platform: template
      name: "Wi-Fi Disconnects (since boot)"
      id: wifi_disconnects_since_boot_sensor
      entity_category: diagnostic
      accuracy_decimals: 0
      update_interval: 30s
      lambda: |-
          return id(_wifi_disconnects_since_boot);

# Since-boot only; not restored across reboots
globals:
    - id: _wifi_disconnects_since_boot
      type: int
      restore_value: no
      initial_value: '0'
